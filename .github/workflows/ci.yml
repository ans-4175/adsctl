name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make fmt-check vet test build
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
