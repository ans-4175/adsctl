version: 2
project_name: adsctl

builds:
  - id: adsctl
    main: ./cmd/adsctl
    binary: adsctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X adsctl/internal/cli.version={{ .Version }}

archives:
  - id: adsctl
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - skills/adsctl/**

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  disable: true

release:
  github:
    owner: imrenagicom
    name: adsctl
